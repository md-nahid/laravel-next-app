# Laravel's dev server only forwards a small allowlist of env vars to the PHP
# built-in server subprocess. See Dockerfile CMD (`--no-reload`).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: example-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-example_app}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REVERB_HOST: reverb
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=0
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-example_app}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REVERB_HOST: reverb
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-example_app}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REVERB_HOST: reverb
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: example-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-example_app}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-example_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  vendor:
